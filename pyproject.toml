# pyproject.toml — el paquete de Python de Rikchay (la Mediateca): dependencias y extras de prueba y de arranque solo
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rikchay"
version = "0.1.0"
description = "Rikchay: la Mediateca de la plataforma Qillqa (fotos, videos y documentos con sus personas, lugares, etiquetas y usos), que funciona dentro de Qillqa o sola con el anfitrión mínimo de Tiqsi."
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.11"
dependencies = [
    "tiqsi",
    "fastapi>=0.110",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pydantic-settings>=2",
    "PyJWT>=2.8",
    "python-multipart>=0.0.9",
    "Pillow>=10",
    "pillow-heif>=0.16",
]

[project.optional-dependencies]
sola = ["uvicorn[standard]>=0.30"]
pruebas = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools]
packages = ["rikchay"]
